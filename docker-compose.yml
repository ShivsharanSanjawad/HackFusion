version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hackfusion-postgres
    environment:
      POSTGRES_DB: hackfusion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - hackfusion-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  main-api:
    build:
      context: ./HackFusion
      dockerfile: Dockerfile
    container_name: hackfusion-main-api
    ports:
      - "8080:8080"
    networks:
      - hackfusion-network
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - PGHOST=postgres
      - PGPORT=5432
      - PGDATABASE=hackfusion
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hackfusion
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
    depends_on:
      postgres:
        condition: service_healthy

  health-monitor:
    build:
      context: ./HackServer
      dockerfile: Dockerfile
    container_name: hackfusion-health-monitor
    ports:
      - "9090:9090"
    networks:
      - hackfusion-network
    restart: unless-stopped
    depends_on:
      - main-api

  auth:
    build:
      context: ./Auth
      dockerfile: Dockerfile
    container_name: hackfusion-auth
    ports:
      - "3000:3000"
    networks:
      - hackfusion-network
    restart: unless-stopped
    depends_on:
      - main-api

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackfusion-frontend
    ports:
      - "8081:8081"
    networks:
      - hackfusion-network
    restart: unless-stopped
    depends_on:
      - main-api
      - auth

networks:
  hackfusion-network:
    driver: bridge

volumes:
  postgres-data: