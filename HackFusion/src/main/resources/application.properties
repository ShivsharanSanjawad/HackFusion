spring.application.name=HackFusion

# Server Configuration
server.port=8080

# Database Connection Settings

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
TelegramBot=${TelegramBot}

spring.ai.google.genai.project-id=${GOOGLE_GENAI_PROJECT_ID}
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}

# Optional: Specify the model (default is usually gemini-1.5-flash)
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
management.endpoints.web.exposure.include=*
cloudinary.cloud_name=${cloud_name}
cloudinary.api_key=${api_key}
cloudinary.api_secret=${api_secret}
spring.jackson.serialization.fail-on-empty-beans=false

# FreeMarker Configuration
spring.freemarker.check-template-location=false

# Spring Boot Admin Client Configuration
spring.boot.admin.client.url=http://localhost:9090
spring.boot.admin.client.auto-registration=true
spring.boot.admin.client.enabled=true

pinata.api.url=https://api.pinata.cloud/pinning/pinFileToIPFS
pinata.api.jwt=${PINATA_JWT}

management.endpoint.env.show-values=ALWAYS
management.endpoint.configprops.show-values=ALWAYS

